<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
 <title id="t">Historical comparison of two Credit Lens design directions</title><desc id="d">Superseded compact banking workspace and guided workflow compared as low fidelity layouts.</desc>
 <style>text{font-family:Arial,sans-serif;fill:#17212b}.m{font-size:13px;fill:#52606d}.h{font-size:22px;font-weight:700}.s{font-size:11px;font-weight:700;letter-spacing:1px;fill:#52606d}.box{fill:#fff;stroke:#d0d5dd}.dark{fill:#17212b}.blue{fill:#155eef}.soft{fill:#f2f4f7}</style>
 <rect width="1200" height="560" fill="#f7f8fa"/><text x="42" y="40" class="s">A · COMPACT OPERATIONAL WORKSPACE — RECOMMENDED</text><text x="644" y="40" class="s">B · GUIDED WORKFLOW</text>
 <rect x="42" y="62" width="516" height="440" rx="10" class="box"/><rect x="42" y="62" width="516" height="48" rx="10" class="dark"/><text x="62" y="92" fill="#fff" font-size="15" font-weight="700">Credit Lens</text><text x="188" y="92" fill="#fff" font-size="12">New request</text><text x="280" y="92" fill="#cbd5e1" font-size="12">Request history</text>
 <text x="70" y="150" class="h">Request credit register extract</text><rect x="70" y="178" width="200" height="255" rx="7" class="box"/><text x="88" y="205" class="s">ONE SHORT FORM</text><rect x="88" y="228" width="164" height="38" rx="4" class="box"/><rect x="88" y="293" width="164" height="38" rx="4" class="box"/><rect x="88" y="359" width="164" height="42" rx="4" class="blue"/><text x="112" y="385" fill="#fff" font-size="13">Request extract</text><rect x="291" y="178" width="239" height="126" rx="7" class="soft"/><text x="310" y="206" class="s">Factual help</text><text x="310" y="237" class="m">One synchronous register query.</text><text x="310" y="260" class="m">No pending request is saved.</text><rect x="291" y="323" width="239" height="110" rx="7" class="box"/><text x="310" y="350" class="s">Later: summary → details</text><text x="310" y="381" class="m">Fast scanning for repeat work.</text><text x="70" y="470" class="m">High data density where it helps: result summary and history table.</text>
 <rect x="644" y="62" width="514" height="440" rx="10" class="box"/><text x="672" y="103" class="h">Request an extract</text><text x="672" y="130" class="m">Step 1 of 3</text><rect x="672" y="153" width="458" height="5" rx="2" fill="#d0d5dd"/><rect x="672" y="153" width="153" height="5" rx="2" class="blue"/><rect x="760" y="190" width="282" height="240" rx="7" class="box"/><text x="784" y="224" class="s">STEP 1 · CONSUMER</text><text x="784" y="262" font-size="16" font-weight="700">Identity code</text><rect x="784" y="280" width="234" height="40" rx="4" class="box"/><text x="784" y="358" class="m">Next, select the purpose.</text><rect x="784" y="379" width="234" height="38" rx="4" class="blue"/><text x="877" y="403" fill="#fff" font-size="13">Continue</text><text x="672" y="470" class="m">Careful first use, but a staged model risks implying a persisted lifecycle.</text>
</svg>
