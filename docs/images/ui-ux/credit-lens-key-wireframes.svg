<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">Credit Lens key screen wireframes</title><desc id="d">Desktop new request and active voluntary credit ban result, plus a mobile result summary.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#17212b}.m{font-size:12px;fill:#52606d}.l{font-size:14px}.h{font-size:22px;font-weight:700}.s{font-size:11px;font-weight:700;letter-spacing:1px;fill:#52606d}.box{fill:#fff;stroke:#d0d5dd}.nav{fill:#17212b}.white{fill:#fff}.red{fill:#b42318}.blue{fill:#155eef}.muted{fill:#f2f4f7}.alert{fill:#fef3f2;stroke:#fecdca}</style>
  <rect width="1200" height="760" fill="#f7f8fa"/>
  <text x="40" y="38" class="s">A · NEW REQUEST / DESKTOP</text>
  <rect x="40" y="56" width="715" height="650" rx="10" class="box"/><rect x="40" y="56" width="715" height="56" rx="10" class="nav"/>
  <text x="64" y="90" class="white" font-size="16" font-weight="700">Credit Lens</text><text x="205" y="90" class="white" font-size="13">New request</text><text x="310" y="90" fill="#cbd5e1" font-size="13">Request history</text>
  <text x="76" y="155" class="h">Request credit register extract</text><text x="76" y="181" class="m">Request an extract from the Finnish Positive Credit Register.</text>
  <rect x="76" y="214" width="285" height="405" rx="8" class="box"/><text x="100" y="250" class="s">CONSUMER AND PURPOSE</text>
  <text x="100" y="291" class="l" font-weight="700">Finnish personal identity code</text><text x="100" y="312" class="m">Format: DDMMYYCZZZQ</text><rect x="100" y="327" width="237" height="44" rx="5" class="box"/><text x="113" y="354" class="m">010190-123A</text>
  <text x="100" y="408" class="l" font-weight="700">Purpose of extract</text><rect x="100" y="425" width="237" height="44" rx="5" class="box"/><text x="113" y="452" class="m">New consumer credit</text><text x="316" y="452" class="m">⌄</text>
  <rect x="100" y="507" width="237" height="47" rx="5" fill="#155eef"/><text x="130" y="536" class="white" font-size="14" font-weight="700">Request extract</text>
  <rect x="390" y="214" width="325" height="183" rx="8" class="muted"/><text x="414" y="250" class="s">BEFORE YOU REQUEST</text><text x="414" y="282" class="l" font-weight="700">One register snapshot</text><text x="414" y="310" class="m">The extract is requested synchronously.</text><text x="414" y="334" class="m">Only a successful response appears in history.</text><text x="414" y="366" class="m">Full identity code is not shown after submission.</text>
  <rect x="390" y="421" width="325" height="198" rx="8" class="box"/><text x="414" y="457" class="s">ACCESSIBLE STATES</text><text x="414" y="488" class="l" font-weight="700">Validation, waiting and recovery</text><text x="414" y="518" class="m">Error summary links back to the field.</text><text x="414" y="542" class="m">Waiting is temporary, not a stored status.</text><text x="414" y="566" class="m">Retry retains the active request identifier.</text>
  <text x="797" y="38" class="s">B · ACTIVE BAN / RESULT</text>
  <rect x="797" y="56" width="363" height="650" rx="10" class="box"/><rect x="797" y="56" width="363" height="56" rx="10" class="nav"/><text x="821" y="90" class="white" font-size="16" font-weight="700">Credit Lens</text>
  <text x="825" y="151" class="h">Extract summary</text><text x="825" y="177" class="m">******-123A · received 18 Sep 2026</text>
  <rect x="821" y="204" width="315" height="132" rx="7" class="alert"/><text x="845" y="242" class="red" font-size="20">⚠</text><text x="877" y="239" class="l red" font-weight="700">Active voluntary credit ban</text><text x="845" y="269" class="m">The register reports an active ban. Apply the</text><text x="845" y="290" class="m">lender's required care process; this is not a decision.</text><text x="845" y="317" class="m">Reason: Risk of identity theft</text>
  <text x="825" y="379" class="s">CREDIT INFORMATION SUMMARY</text><rect x="821" y="398" width="97" height="82" rx="6" class="muted"/><rect x="929" y="398" width="97" height="82" rx="6" class="muted"/><rect x="1037" y="398" width="99" height="82" rx="6" class="muted"/>
  <text x="844" y="430" class="h">3</text><text x="837" y="455" class="m">Lenders</text><text x="952" y="430" class="h">5</text><text x="943" y="455" class="m">Contracts</text><text x="1060" y="430" class="h">1</text><text x="1044" y="455" class="m">Guaranteed</text>
  <text x="825" y="528" class="s">PROVENANCE</text><text x="825" y="557" class="m">Source</text><text x="967" y="557" class="l">Positive Credit Register</text><line x1="825" y1="570" x2="1136" y2="570" stroke="#d0d5dd"/><text x="825" y="596" class="m">Extract reference</text><text x="967" y="596" class="l">2fdc…2a10</text><line x1="825" y1="609" x2="1136" y2="609" stroke="#d0d5dd"/><text x="825" y="635" class="m">Extract created</text><text x="967" y="635" class="l">18 Sep 2026, 10:15 UTC</text><rect x="821" y="658" width="315" height="34" rx="5" fill="#155eef"/><text x="912" y="680" class="white" font-size="13" font-weight="700">Request another extract</text>
</svg>
