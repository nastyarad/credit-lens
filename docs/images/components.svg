<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-labelledby="title description">
  <title id="title">Backend create-request components</title>
  <desc id="description">The financing request controller delegates create processing to the service, which uses three repositories and the Positive Credit Register client.</desc>
  <style>
    text{font:15px Arial,sans-serif;fill:#172033}
    .heading{font-size:20px;font-weight:bold}
    .scope{font-size:13px;fill:#425466}
    .box{fill:#eef4ff;stroke:#4169a1;stroke-width:2}
    .line{stroke:#425466;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#425466"/></marker></defs>
  <text class="heading" x="35" y="25">Backend create-request flow</text>
  <text class="scope" x="35" y="47">Scope: create operation only; history, details, and monitoring use separate controller methods.</text>
  <g transform="translate(0 38)">
    <rect class="box" x="35" y="100" width="140" height="52" rx="8"/><text x="105" y="132" text-anchor="middle">Controller</text>
    <rect class="box" x="245" y="100" width="140" height="52" rx="8"/><text x="315" y="132" text-anchor="middle">Service</text>
    <rect class="box" x="470" y="25" width="190" height="48" rx="8"/><text x="565" y="55" text-anchor="middle">ConsumerRepository</text>
    <rect class="box" x="470" y="85" width="220" height="48" rx="8"/><text x="580" y="115" text-anchor="middle">FinancingRequestRepository</text>
    <rect class="box" x="470" y="145" width="190" height="48" rx="8"/><text x="565" y="175" text-anchor="middle">CreditExtractRepository</text>
    <rect class="box" x="470" y="205" width="250" height="48" rx="8"/><text x="595" y="235" text-anchor="middle">PositiveCreditRegisterClient</text>
    <path class="line" d="M175 126 H245"/><path class="line" d="M385 126 H430 V49 H470"/><path class="line" d="M430 109 H470"/><path class="line" d="M430 169 H470"/><path class="line" d="M430 229 H470"/>
  </g>
</svg>
