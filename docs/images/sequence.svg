<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title description">
  <title id="title">Credit Lens create-request sequence</title>
  <desc id="description">A matching stored request returns without a PCR call. A new request calls PCR outside a database transaction. Only a valid result is stored; a PCR failure returns problem details with no writes.</desc>
  <style>
    text{font:14px Arial,sans-serif;fill:#172033}
    .head{fill:#eef4ff;stroke:#4169a1;stroke-width:2}
    .life{stroke:#91a4bd;stroke-width:2;stroke-dasharray:6 5}
    .msg{stroke:#425466;stroke-width:2;fill:none;marker-end:url(#arrow)}
    .frame{fill:#faf7e8;stroke:#b18a31;stroke-width:1.5;stroke-dasharray:5 4}
    .success{fill:#f0f9f4;stroke:#34805a;stroke-width:1.5;stroke-dasharray:5 4}
    .failure{fill:#fff2f0;stroke:#b95045;stroke-width:1.5;stroke-dasharray:5 4}
    .label{font-size:13px;font-weight:bold}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#425466"/></marker></defs>

  <rect class="head" x="55" y="20" width="130" height="40" rx="6"/><text x="120" y="46" text-anchor="middle">Controller</text>
  <rect class="head" x="265" y="20" width="130" height="40" rx="6"/><text x="330" y="46" text-anchor="middle">Service</text>
  <rect class="head" x="475" y="20" width="130" height="40" rx="6"/><text x="540" y="46" text-anchor="middle">Repositories</text>
  <rect class="head" x="685" y="20" width="130" height="40" rx="6"/><text x="750" y="46" text-anchor="middle">Mock PCR</text>
  <path class="life" d="M120 60 V630"/><path class="life" d="M330 60 V630"/><path class="life" d="M540 60 V630"/><path class="life" d="M750 60 V630"/>

  <rect class="frame" x="35" y="80" width="850" height="115" rx="5"/><text class="label" x="50" y="102">Existing matching request</text>
  <path class="msg" d="M120 125 H330"/><text x="225" y="117" text-anchor="middle">create(request)</text>
  <path class="msg" d="M330 150 H540"/><text x="435" y="142" text-anchor="middle">find(clientRequestId)</text>
  <path class="msg" d="M540 170 H330"/><text x="435" y="166" text-anchor="middle">stored request + extract</text>
  <path class="msg" d="M330 185 H120"/><text x="225" y="181" text-anchor="middle">200 response; no PCR call</text>

  <rect class="frame" x="35" y="220" width="850" height="400" rx="5"/><text class="label" x="50" y="242">New request</text>
  <path class="msg" d="M120 270 H330"/><text x="225" y="262" text-anchor="middle">create(request)</text>
  <path class="msg" d="M330 300 H540"/><text x="435" y="292" text-anchor="middle">find(clientRequestId): none</text>
  <path class="msg" d="M330 335 H750"/><text x="540" y="327" text-anchor="middle">request extract (no DB transaction)</text>

  <rect class="success" x="285" y="360" width="550" height="145" rx="5"/><text class="label" x="300" y="382">Valid PCR response</text>
  <path class="msg" d="M750 405 H330"/><text x="540" y="397" text-anchor="middle">valid extract</text>
  <path class="msg" d="M330 440 H540"/><text x="435" y="432" text-anchor="middle">one transaction: Consumer + Request + Extract</text>
  <path class="msg" d="M540 465 H330"/><text x="435" y="457" text-anchor="middle">committed aggregate</text>
  <path class="msg" d="M330 490 H120"/><text x="225" y="482" text-anchor="middle">201 response + Location</text>

  <rect class="failure" x="285" y="525" width="550" height="75" rx="5"/><text class="label" x="300" y="547">PCR failure</text>
  <path class="msg" d="M750 565 H330"/><text x="540" y="557" text-anchor="middle">timeout, rejection, unavailable, or invalid</text>
  <path class="msg" d="M330 590 H120"/><text x="225" y="582" text-anchor="middle">problem detail; no database writes</text>
</svg>
