<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610">
  <style>text{font:14px Arial,sans-serif;fill:#172033}.head{fill:#eef4ff;stroke:#4169a1;stroke-width:2}.life{stroke:#91a4bd;stroke-width:2;stroke-dasharray:6 5}.msg{stroke:#425466;stroke-width:2;fill:none;marker-end:url(#arrow)}.alt{fill:#faf7e8;stroke:#b18a31;stroke-width:1.5;stroke-dasharray:5 4}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#425466"/></marker></defs>
  <rect class="head" x="55" y="20" width="130" height="40" rx="6"/><text x="120" y="46" text-anchor="middle">Controller</text>
  <rect class="head" x="265" y="20" width="130" height="40" rx="6"/><text x="330" y="46" text-anchor="middle">Service</text>
  <rect class="head" x="475" y="20" width="130" height="40" rx="6"/><text x="540" y="46" text-anchor="middle">Repositories</text>
  <rect class="head" x="685" y="20" width="130" height="40" rx="6"/><text x="750" y="46" text-anchor="middle">Mock PCR</text>
  <path class="life" d="M120 60 V590"/><path class="life" d="M330 60 V590"/><path class="life" d="M540 60 V590"/><path class="life" d="M750 60 V590"/>
  <rect class="alt" x="35" y="80" width="850" height="80" rx="5"/><text x="50" y="100">Existing matching request</text>
  <path class="msg" d="M120 120 H330"/><text x="225" y="112" text-anchor="middle">create(request)</text><path class="msg" d="M330 140 H540"/><text x="435" y="132" text-anchor="middle">find(clientRequestId)</text><path class="msg" d="M540 155 H330"/><text x="435" y="152" text-anchor="middle">saved request + extract</text><path class="msg" d="M330 175 H120"/><text x="225" y="170" text-anchor="middle">response, 200</text>
  <rect class="alt" x="35" y="205" width="850" height="360" rx="5"/><text x="50" y="225">New request</text>
  <path class="msg" d="M120 250 H330"/><text x="225" y="242" text-anchor="middle">create(request)</text><path class="msg" d="M330 275 H540"/><text x="435" y="267" text-anchor="middle">find(clientRequestId)</text><path class="msg" d="M330 315 H750"/><text x="540" y="307" text-anchor="middle">request extract (no DB transaction)</text><path class="msg" d="M750 350 H330"/><text x="540" y="342" text-anchor="middle">extract or error</text>
  <path class="msg" d="M330 405 H540"/><text x="435" y="397" text-anchor="middle">one transaction: Consumer + Request + Extract</text><path class="msg" d="M540 440 H330"/><text x="435" y="432" text-anchor="middle">committed</text><path class="msg" d="M330 475 H120"/><text x="225" y="467" text-anchor="middle">response, 201 + Location</text><path class="msg" d="M330 520 H120"/><text x="225" y="512" text-anchor="middle">problem detail; no writes</text>
</svg>
