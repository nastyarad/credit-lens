spring.application.name=monitoring-service
spring.main.web-application-type=none

spring.datasource.url=${MONITORING_DB_URL:jdbc:postgresql://localhost:5433/credit_lens_monitoring}
spring.datasource.username=${MONITORING_DB_USER:credit_lens_monitoring}
spring.datasource.password=${MONITORING_DB_PASSWORD:credit_lens_monitoring}
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

backend.base-url=${BACKEND_BASE_URL:http://localhost:8080}
backend.connect-timeout=${BACKEND_CONNECT_TIMEOUT:2s}
backend.read-timeout=${BACKEND_READ_TIMEOUT:5s}

monitoring.cron=${MONITORING_CRON:0 */5 * * * *}
monitoring.initial-lookback=${MONITORING_INITIAL_LOOKBACK:PT5M}
monitoring.recipient=${MONITORING_RECIPIENT:pcr_monitoring@dansketest.dk}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH_ENABLED:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECT_TIMEOUT:2000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT:5000}
mail.sender=${SMTP_SENDER:credit-lens-monitoring@localhost}
