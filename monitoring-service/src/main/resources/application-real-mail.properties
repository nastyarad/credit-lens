# Deliberate opt-in profile for sending reports through a real SMTP server.
# Keep credentials in environment variables or a secret manager.
# To configure this profile directly, replace the placeholders below and
# uncomment the corresponding properties:
# monitoring.recipient=your.email@example.com
# spring.mail.host=smtp.example.com
# spring.mail.port=587
# spring.mail.username=your.smtp.username
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# mail.sender=monitoring@example.com

monitoring.recipient=${MONITORING_RECIPIENT}

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLED:true}
mail.sender=${SMTP_SENDER}
