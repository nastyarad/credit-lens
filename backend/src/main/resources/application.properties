spring.application.name=backend
pcr.base-url=${PCR_BASE_URL:http://localhost:8081}
pcr.target-environment=${PCR_TARGET_ENVIRONMENT:Test}
pcr.owner.id-code-type=${PCR_OWNER_ID_CODE_TYPE:BusinessId}
pcr.owner.id-code=${PCR_OWNER_ID_CODE:1234567-8}
pcr.owner.country-code=${PCR_OWNER_COUNTRY_CODE:FI}
pcr.connect-timeout=${PCR_CONNECT_TIMEOUT:2s}
pcr.read-timeout=${PCR_READ_TIMEOUT:5s}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/credit_lens_backend}
spring.datasource.username=${DB_USER:credit_lens}
spring.datasource.password=${DB_PASSWORD:credit_lens}

spring.flyway.enabled=true
spring.flyway.clean-disabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
